<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>HUD önizleme probu</title>
<link rel="stylesheet" href="css/style.css">
<style>body { padding: 14px; }</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <footer id="battle-bar">
      <div id="players" role="list" aria-label="Robotlar"></div>
      <div id="battle-actions">
        <button id="weapon-toggle" type="button"><span>SİLAH</span><span>DEĞİŞTİR</span></button>
        <button class="act-slot" id="slot-weapon" type="button" data-slot="weapon"><canvas class="slot-icon" width="44" height="44"></canvas><span class="slot-count"></span><span class="slot-name"></span></button>
        <button class="act-slot" id="slot-skill" type="button" data-slot="skill"><canvas class="slot-icon" width="44" height="44"></canvas><span class="slot-count"></span><span class="slot-name"></span></button>
        <button class="act-slot" id="slot-teleport" type="button" data-slot="teleport"><canvas class="slot-icon" width="44" height="44"></canvas><span class="slot-count"></span><span class="slot-name"></span></button>
        <button class="act-slot" id="slot-hook" type="button" data-slot="hook"><canvas class="slot-icon" width="44" height="44"></canvas><span class="slot-count"></span><span class="slot-name"></span></button>
      </div>
    </footer>
    <div id="weapon-panel">
      <div id="weapon-bar"></div>
      <div id="weapon-desc"></div>
    </div>
  </div>
</div>
<script src="js/i18n.js"></script>
  <script src="js/portal.js"></script>
<script src="js/audio.js"></script>
<script src="js/characters.js"></script>
<script src="js/progression.js"></script>
<script src="js/profile.js"></script>
<script src="js/parts.js"></script>
<script src="js/market.js"></script>
<script src="js/maps.js"></script>
<script src="js/skills.js"></script>
<script src="js/skill-fx.js"></script>
<script src="js/robots.js"></script>
<script src="js/terrain.js"></script>
<script src="js/weapons.js"></script>
<script src="js/entity.js"></script>
<script src="js/projectile.js"></script>
<script src="js/ai.js"></script>
  <script src="js/net/protocol.js"></script>
  <script src="js/net/transport.js"></script>
  <script src="js/net/state.js"></script>
  <script src="js/net/session.js"></script>
  <script src="js/net/adapter.js"></script>
  <script src="js/online-lobby.js"></script>
<script src="js/game.js"></script>
<script>
// Gerçek HUD kodunu (Game.prototype.updateWeaponHud + paintProjectilePreview +
// paintBattleSlots) sahte bir oyun nesnesiyle çalıştırır. Sahne görünürlüğü
// için açılır panel `.open` sınıfına bağlıdır.
const fake = Object.create(Game.prototype);
fake.state = "AIMING";
fake.turn = 0;
fake._weaponKey = null;
fake.weaponMenuOpen = true;
const ammo = {};
for (const w of WEAPONS) ammo[w.id] = w.ammo;
// `active`, Game.prototype'te getter (players[turn]); weaponSpec Entity getter.
fake.players = [{
  weapon: 0, ammo: ammo, weaponSpec: WEAPONS[0],
  charDef: CHARACTERS[0], skillCooldown: 0, resolvedSkill: null,
}];
fake.updateWeaponHud();
document.getElementById("weapon-panel").classList.remove("hidden");

// drawMines artık mermi çizicisini paylaşıyor: kurulu/kurulmamış mayın görünümü
const scene = document.createElement("canvas");
scene.width = 420;
scene.height = 120;
scene.style.cssText = "position:fixed;top:8px;left:8px;z-index:9;background:#243040;border-radius:8px;display:block";
document.body.appendChild(scene);
const mineSpec = WEAPONS.find((w) => w.id === "mine");
fake.mines = [
  { x: 70, y: 70, spec: mineSpec, arm: 0, owner: 0 },
  { x: 170, y: 70, spec: mineSpec, arm: 30, owner: 0 },
];
fake.drawMines(scene.getContext("2d"));

// Dahili modül kartı (drawSkillHud): mermi fırlatan modüllerde sağda önizleme
const hud = document.createElement("canvas");
hud.width = 260;
hud.height = 60 * 6;
hud.style.cssText = "position:fixed;top:8px;left:440px;z-index:9;background:#243040;border-radius:8px";
document.body.appendChild(hud);
const hctx = hud.getContext("2d");
const spitters = CHARACTERS.filter((c) => c.skill && c.skill.kind === "spit");
spitters.forEach((c, i) => {
  hctx.save();
  hctx.translate(0, i * 60);
  drawSkillHud(hctx, { skillId: c.skill.id, charDef: c, skillCooldown: 0 }, 260, 60);
  hctx.restore();
});

window.__ready = true;
</script>
</body>
</html>
