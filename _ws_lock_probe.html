<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Atölye eylem plakası beş durum — görsel doğrulama</title>
  <style>
    body { margin: 0; background: #05080c; }
    canvas { position: fixed; left: 0; width: 960px; height: 540px; }
    #c1 { top: 0; } #c2 { top: 540px; } #c3 { top: 1080px; }
    #c4 { top: 1620px; } #c5 { top: 2160px; }
  </style>
</head>
<body>
  <canvas id="c1" width="960" height="540"></canvas>
  <canvas id="c2" width="960" height="540"></canvas>
  <canvas id="c3" width="960" height="540"></canvas>
  <canvas id="c4" width="960" height="540"></canvas>
  <canvas id="c5" width="960" height="540"></canvas>
  <script src="js/i18n.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/parts.js"></script>
  <script src="js/market.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/skill-fx.js"></script>
  <script src="js/robots.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/entity.js"></script>
  <script src="js/projectile.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/game.js"></script>
  <script>
    // Beş eylem-plakası durumu: kilitli (Sv.1) / Hurda eksik / hazır /
    // Sv.5 + Hurda eksik (dar alan) / tam kalibrasyon. Plaka her durumda
    // panelin alt boşluğunu doldurur ve panel dibine yapışır — arada boşluk yok.
    function makeWs(robot, scrap) {
      const g = Object.create(Game.prototype);
      g.W = 960; g.H = 540;
      g.input = { mouseX: -1, mouseY: -1 };
      g.renderTimeMs = 0;
      g.selectedChars = [];
      g.profile = normalizeProfile({ version: 6, scrap: scrap, parts: [], robots: { kopek: robot } });
      g.workshopSelectedId = "kopek";
      g.workshopPage = 0;
      g.workshopBranch = "chassis";
      g.workshopMode = "upgrades";
      g.workshopFx = null;
      g.workshopNotice = null;
      g.updateHud = () => {};
      return g;
    }
    const states = [
      makeWs({ xp: 0, upgrades: { chassis: 0, module: 0, core: 0 } }, 200),        // kilitli
      makeWs({ xp: 120, upgrades: { chassis: 0, module: 0, core: 0 } }, 30),       // Hurda eksik
      makeWs({ xp: 120, upgrades: { chassis: 0, module: 0, core: 0 } }, 200),      // hazır
      makeWs({ xp: 700, upgrades: { chassis: 1, module: 0, core: 0 } }, 52),        // Sv.5 + Hurda eksik (dar alan: panel dibine yapışık)
      makeWs({ xp: 2700, upgrades: { chassis: 3, module: 0, core: 0 } }, 200),     // tam kalibrasyon
    ];
    states.forEach((g, i) => g.renderWorkshop(document.getElementById("c" + (i + 1)).getContext("2d")));
  </script>
</body>
</html>
