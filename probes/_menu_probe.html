<!DOCTYPE html>
<html lang="tr">
<head>
<base href="../">
  <meta charset="UTF-8" />
  <title>Ana menü — key art ve altı kart yerleşimi</title>
  <style>
    body { margin: 0; background: #05080c; }
    canvas { position: fixed; left: 0; display: block; }
    #wide { top: 0; }
    #narrow { top: 540px; }
  </style>
</head>
<body>
  <canvas id="wide" width="960" height="540"></canvas>
  <canvas id="narrow" width="700" height="540"></canvas>

  <script src="js/i18n.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/parts.js"></script>
  <script src="js/market.js"></script>
  <script src="js/assets-manifest.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/skill-fx.js"></script>
  <script src="js/robot-animation-manifest.js"></script>
  <script src="js/robots.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/entity.js"></script>
  <script src="js/projectile.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/net/protocol.js"></script>
  <script src="js/net/transport.js"></script>
  <script src="js/net/state.js"></script>
  <script src="js/net/session.js"></script>
  <script src="js/net/adapter.js"></script>
  <script src="js/online-lobby.js"></script>
  <script src="js/game.js"></script>
  <script>
    function makeFake(w, h, mouse) {
      const g = Object.create(Game.prototype);
      g.W = w; g.H = h;
      g.input = { mouseX: mouse[0], mouseY: mouse[1] };
      g.renderTimeMs = 0;
      g.profile = normalizeProfile({
        version: 3, scrap: 1240,
        robots: {
          [CHARACTERS[0].id]: { xp: 450, ammo: { grenade: 3, nuke: 1 } },
          [CHARACTERS[4].id]: { xp: 120, ammo: { sniper: 2 } },
        },
      });
      return g;
    }
    // 960 px görünümde yerel mod kartında hover; 700 px görünümde taşma kontrolü.
    // Dil varyantı: #en (veya ?locale=en) ile İngilizce menü çizilir; EN metin
    // uzunluğu kartlara sığıyor mu diye headless ekran alınır (F2 doğrulaması).
    const params = new URLSearchParams(location.search);
    const wantEn = location.hash.indexOf("en") >= 0 || params.get("locale") === "en";
    if (wantEn) setLocale("en", { persist: false });
    const wide = makeFake(960, 540, [558, 292]);
    const narrow = makeFake(700, 540, [-1, -1]);
    function paintMenus() {
      wide.renderModeSelect(document.getElementById("wide").getContext("2d"));
      narrow.renderModeSelect(document.getElementById("narrow").getContext("2d"));
    }
    paintMenus();
    // assetImage starts asynchronous file:// image loads on the first draw.
    // Repaint after they settle so a headless screenshot shows the real assets.
    setTimeout(paintMenus, 500);
  </script>
</body>
</html>
