<!DOCTYPE html>
<html lang="tr">
<head>
<base href="../">
  <meta charset="UTF-8" />
  <title>Seçim ekranları (harita / oyuncu / zorluk) — görsel doğrulama</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Dört ekran tek karede: sondalar sahne dışında kaldığı için position:fixed
       ile alt alta dizilir (bkz. verify-canvas-visuals-headless becerisi). */
    body { margin: 0; background: #05080c; }
    canvas { position: fixed; left: 0; width: 960px; height: 540px; }
    #c1 { top: 0; } #c2 { top: 540px; } #c3 { top: 1080px; } #c4 { top: 1620px; }
  </style>
</head>
<body>
  <canvas id="c1" width="960" height="540"></canvas>
  <canvas id="c2" width="960" height="540"></canvas>
  <canvas id="c3" width="960" height="540"></canvas>
  <canvas id="c4" width="960" height="540"></canvas>
  <!-- Oyunla aynı klasik script sırası -->
  <script src="js/i18n.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/robot-rig-profiles.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/parts.js"></script>
  <script src="js/market.js"></script>
  <script src="js/assets-manifest.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/skill-fx.js"></script>
  <script src="js/robots.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/entity.js"></script>
  <script src="js/projectile.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/net/protocol.js"></script>
  <script src="js/net/transport.js"></script>
  <script src="js/net/state.js"></script>
  <script src="js/net/session.js"></script>
  <script src="js/net/adapter.js"></script>
  <script src="js/online-lobby.js"></script>
  <script src="js/game.js"></script>
  <script>
    // Dil varyantı: ?locale=en (veya #en) ile İngilizce metin sığdırması ölçülür.
    const params = new URLSearchParams(location.search);
    if (location.hash.indexOf("en") >= 0 || params.get("locale") === "en") setLocale("en", { persist: false });

    // Sahte oyun nesnesi: seçim ekranları yalnız bu alanları okur (DOM'a dokunmaz).
    function makeFake(page) {
      const g = Object.create(Game.prototype);
      g.W = 960; g.H = 540;
      g.input = { mouseX: -1, mouseY: -1 };
      g.renderTimeMs = 0;
      g.mapPage = page || 0;
      g.difficulty = "normal";
      g.botCount = 2;
      g.selectedChars = [CHARACTERS[0], CHARACTERS[1]];
      g.profile = normalizeProfile({ version: 5, scrap: 260 });
      return g;
    }

    function paintSelections() {
      makeFake(0).renderMapSelect(document.getElementById("c1").getContext("2d"));
      makeFake(1).renderMapSelect(document.getElementById("c2").getContext("2d"));
      makeFake().renderCountSelect(document.getElementById("c3").getContext("2d"));
      makeFake().renderDifficultySelect(document.getElementById("c4").getContext("2d"));
    }
    paintSelections();
    // Repaint after file:// images finish loading so screenshot probes show key art.
    setTimeout(paintSelections, 500);
  </script>
</body>
</html>
