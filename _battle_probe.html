<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dökümhane-9 — Arena Prototipi</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="stage">
      <header id="hud">
        <div class="center">
          <div id="turn-banner">Sıra: -</div>
          <div id="wind-indicator" role="status" aria-live="polite">Rüzgar: -</div>
          <button id="fullscreen-btn" title="Tam ekran (F)" data-i18n-title="hud.fullscreen.title">⛶ <span data-i18n="hud.fullscreen">Tam Ekran</span></button>
          <button id="quit-btn" title="Menüye dön (Esc)" data-i18n-title="hud.quit.title">⏏ <span data-i18n="hud.quit">Çıkış</span></button>
        </div>
      </header>

      <div id="audio-control" role="group" aria-label="Ses ayarları">
        <button id="mute-btn" type="button" title="Sesi kapat (M)" aria-label="Sesi kapat" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M11 5 6 9H3v6h3l5 4Z" />
            <path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" />
            <path class="sound-off" d="m16 9 6 6m0-6-6 6" />
          </svg>
          <span id="mute-label">Ses</span>
        </button>
        <input id="volume-slider" type="range" min="0" max="100" step="1" value="100" aria-label="Ses düzeyi" />
        <output id="volume-value" for="volume-slider">100%</output>
      </div>

      <canvas id="game" width="960" height="540"></canvas>

      <div id="power-bar" class="hidden">
        <div id="power-fill"></div>
        <div id="power-marker" class="hidden" title="Son atış gücü"></div>
      </div>

      <div id="storage-warning" class="hidden" role="status" aria-live="polite"></div>

      <div id="overlay" class="hidden">
        <div class="overlay-card">
          <h1 id="overlay-title">Tahsis Tamamlandı</h1>
          <p id="overlay-sub"></p>
          <div id="overlay-reward" class="hidden" role="status"></div>
          <div class="overlay-actions">
            <button id="workshop-btn">Atölyeye Git</button>
            <button id="restart-btn">Tekrar Oyna</button>
            <button id="menu-btn" class="secondary">Ana Menü</button>
          </div>
        </div>
      </div>

      <footer id="battle-bar" class="hidden">
        <div id="players" role="list" aria-label="Robotlar"></div>
        <div id="battle-actions">
          <button id="weapon-toggle" type="button" title="Silah listesini aç/kapat (1–9)">
            <span data-i18n="hud.weaponToggle.a">SİLAH</span><span data-i18n="hud.weaponToggle.b">DEĞİŞTİR</span>
          </button>
          <button class="act-slot" id="slot-weapon" type="button" data-slot="weapon" title="Seçili silah">
            <canvas class="slot-icon" width="44" height="44"></canvas>
            <span class="slot-count"></span><span class="slot-name"></span>
          </button>
          <button class="act-slot" id="slot-skill" type="button" data-slot="skill" title="Dahili modül (Q)">
            <canvas class="slot-icon" width="44" height="44"></canvas>
            <span class="slot-count"></span><span class="slot-name"></span>
          </button>
          <button class="act-slot" id="slot-teleport" type="button" data-slot="teleport" title="Işınlanma Topu">
            <canvas class="slot-icon" width="44" height="44"></canvas>
            <span class="slot-count"></span><span class="slot-name"></span>
          </button>
          <button class="act-slot" id="slot-hook" type="button" data-slot="hook" title="Kanca">
            <canvas class="slot-icon" width="44" height="44"></canvas>
            <span class="slot-count"></span><span class="slot-name"></span>
          </button>
        </div>
      </footer>

      <div id="weapon-panel" class="hidden">
        <div id="weapon-bar"></div>
        <div id="weapon-desc"></div>
      </div>

    </div>

  </div>

  <!-- Klasik scriptler: file:// üzerinden çift tıklayınca çalışır -->
  <script src="js/i18n.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/parts.js"></script>
  <script src="js/market.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/skill-fx.js"></script>
  <script src="js/robots.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/entity.js"></script>
  <script src="js/projectile.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/net/protocol.js"></script>
  <script src="js/net/transport.js"></script>
  <script src="js/net/state.js"></script>
  <script src="js/net/session.js"></script>
  <script src="js/net/adapter.js"></script>
  <script src="js/online-lobby.js"></script>
  <script src="js/game.js"></script>

<script>
// Gerçek savaş sahnesi: alt panel (oyuncu kartları + silah/modül/yardımcı
// yuvaları) ve açılır silah listesi gerçek kodla çizilir. `#open` ile açılır
// liste de görünür (CHANGE WEAPON ekran görüntüsü).
window.addEventListener("DOMContentLoaded", () => {
  const canvas = document.getElementById("game");
  const game = new Game(canvas);
  const mode = location.hash.replace("#", "");
  const count = mode === "p6" ? 6 : mode === "p2" ? 2 : 4;
  // ?char=<id> ile ilk robot seçilir: uzun modül etiketlerinin yuva kutusuna
  // sığdığı böyle sınanır (ör. sirtlan → EN "Frequency Overflow").
  const charParam = new URLSearchParams(location.search).get("char");
  const picked = charParam ? CHARACTERS.find((c) => c.id === charParam) : null;
  game.selectedChars = picked
    ? [picked].concat(CHARACTERS.filter((c) => c.id !== picked.id).slice(0, count - 1))
    : CHARACTERS.slice(0, count);
  game.selectedMap = MAPS[0];
  game.playerControls = game.selectedChars.map((_, i) => i === 0 ? "human" : "bot");
  game.mode = "computer";
  game.startGame();
  game.players[0].skillCooldown = 0;
  if (mode === "dead") game.players[1].alive = false;
  game.updateHud();
  setTimeout(() => {
    game.syncBottomHud();
    const bar = document.getElementById("battle-bar");
    console.log("BAR h=" + bar.offsetHeight + " state=" + game.state +
      " powerBottom=" + document.getElementById("power-bar").style.bottom);
    if (location.hash === "#test") {
      const log = [];
      const player = game.players[0];
      document.getElementById("weapon-toggle").click();
      log.push("open=" + game.weaponMenuOpen + " panelOpen=" + document.getElementById("weapon-panel").classList.contains("open"));
      document.querySelectorAll("#weapon-bar .weapon-chip")[1].click();
      log.push("weapon=" + WEAPONS[player.weapon].id + " menuClosed=" + !game.weaponMenuOpen);
      const cdBefore = player.skillCooldown;
      document.getElementById("slot-skill").click();
      log.push("skillUsed=" + (player.skillCooldown > cdBefore) + " cd=" + player.skillCooldown);
      document.getElementById("slot-teleport").click();
      log.push("teleport=" + WEAPONS[player.weapon].id);
      document.getElementById("slot-hook").click();
      log.push("hook=" + WEAPONS[player.weapon].id);
      console.log("TEST " + log.join(" | "));
      window.__ready = true;
      return;
    }
    if (location.hash === "#open") {
      game.weaponMenuOpen = true;
      game.updateHud();
      setTimeout(() => {
        game.syncBottomHud();
        console.log("PANEL top=" + Math.round(game.hudPanelRect.top) +
          " bottom=" + Math.round(game.hudPanelRect.bottom));
        window.__ready = true;
      }, 150);
    } else {
      window.__ready = true;
    }
  }, 400);
});
</script>

</body>
</html>
