<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yürüyüş — gerçek maç doğrulaması (oyuna dâhil değil) | Dökümhane-9 — Arena Prototipi</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="stage">
      <header id="hud">
        <div id="players"></div>
        <div class="center">
          <div id="turn-banner">Sıra: -</div>
          <div id="wind-indicator" role="status" aria-live="polite">Rüzgar: -</div>
          <button id="fullscreen-btn" title="Tam ekran (F)">⛶ Tam Ekran</button>
          <button id="quit-btn" title="Menüye dön (Esc)">⏏ Çıkış</button>
        </div>
      </header>

      <!-- Ses denetimi HUD'un dışında, sahneye sabit: HUD menülerde gizlenirken
           (karakter/harita/atölye ekranları) da erişilebilir kalır. -->
      <div id="audio-control" role="group" aria-label="Ses ayarları">
        <button id="mute-btn" type="button" title="Sesi kapat (M)" aria-label="Sesi kapat" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M11 5 6 9H3v6h3l5 4Z" />
            <path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" />
            <path class="sound-off" d="m16 9 6 6m0-6-6 6" />
          </svg>
          <span id="mute-label">Ses</span>
        </button>
        <input id="volume-slider" type="range" min="0" max="100" step="1" value="100" aria-label="Ses düzeyi" />
        <output id="volume-value" for="volume-slider">100%</output>
      </div>

      <canvas id="game" width="960" height="540"></canvas>

      <div id="power-bar" class="hidden">
        <div id="power-fill"></div>
        <div id="power-marker" class="hidden" title="Son atış gücü"></div>
      </div>

      <div id="overlay" class="hidden">
        <div class="overlay-card">
          <h1 id="overlay-title">Tahsis Tamamlandı</h1>
          <p id="overlay-sub"></p>
          <div id="overlay-reward" class="hidden" role="status"></div>
          <div class="overlay-actions">
            <button id="workshop-btn">Atölyeye Git</button>
            <button id="restart-btn">Tekrar Oyna</button>
            <button id="menu-btn" class="secondary">Ana Menü</button>
          </div>
        </div>
      </div>

      <div id="storage-warning" class="hidden" role="status" aria-live="polite"></div>

      <div id="weapon-panel" class="hidden">
        <div id="weapon-bar"></div>
        <div id="weapon-desc"></div>
      </div>

    </div>

  </div>

  <!-- Klasik scriptler: file:// üzerinden çift tıklayınca çalışır -->
  <script src="js/i18n.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/parts.js"></script>
  <script src="js/market.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/skill-fx.js"></script>
  <script src="js/robots.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/entity.js"></script>
  <script src="js/projectile.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/game.js"></script>
<script>
// Dev doğrulama (oyuna dâhil değil): gerçek maç döngüsünde (Game.update →
// Entity.walk → Entity.update → Game.render) yürüyen robotu tek karede
// dondurur. Animasyonun oyun içi girdiyle (aim, zemin eğimi) de doğru
// kurulduğunu gösterir; RAF durdurulur ki kare sönmesin.
window.addEventListener("DOMContentLoaded", () => {
  // RAF'ı kapat: kare dondurulacaksa oyun döngüsü ikinci kez render etmemeli.
  window.requestAnimationFrame = () => 0;
  const canvas = document.getElementById("game");
  const game = new Game(canvas);
  game.selectedChars = [CHARACTERS[0], CHARACTERS[1], CHARACTERS[2]];
  game.selectedMap = MAPS[0];
  game.playerControls = ["human", "bot", "bot"];
  game.mode = "computer";
  game.startGame();
  game.loop = () => {};
  const p = game.players[0];
  // Oyuncuya sıra ver, sağa yürüt, nişanı öne al (namlu iki elle tutulsun).
  game.state = "AIMING";
  game.turn = 0;
  game.input.right = true;
  game.input.mouseX = p.x + 220;
  game.input.mouseY = p.y - p.r * 3;
  const x0 = p.x;
  for (let i = 0; i < 45; i++) game.update(1 / 60);   // ~99px: bacaklar ayrık pozda don

  game.renderTimeMs = 1234;
  game.render();

  // Yakınlaştırma kutusu: sahnedeki küçük robotta adım pozunu okunur kılar.
  const zoom = canvas.getContext("2d");
  const sw = 104, sh = 92, sxp = Math.max(0, Math.min(canvas.width - sw, p.x - sw / 2));
  const syp = Math.max(0, Math.min(canvas.height - sh, p.y - sh * 0.66));
  zoom.save();
  zoom.setTransform(1, 0, 0, 1, 0, 0);
  zoom.globalAlpha = 1;
  zoom.imageSmoothingEnabled = false;
  zoom.drawImage(canvas, sxp, syp, sw, sh, canvas.width - 340, 104, sw * 3, sh * 3);
  zoom.strokeStyle = "#63e6be"; zoom.lineWidth = 1;
  zoom.strokeRect(canvas.width - 340, 104, sw * 3, sh * 3);
  zoom.font = '11px "Segoe UI", sans-serif'; zoom.fillStyle = "#63e6be";
  zoom.fillText("yürüyen robot (3×)", canvas.width - 338, 98);
  zoom.restore();
  const probe = zoom.getImageData(canvas.width - 200, 200, 1, 1).data;
  console.log("MEASURE inset px=" + probe[0] + "," + probe[1] + "," + probe[2]);
  console.log("MEASURE dx=" + (p.x - x0).toFixed(1) +
    " phase=" + p.walkPhase.toFixed(3) +
    " blend=" + p.walkBlend.toFixed(3) +
    " walkAnim=" + p.walkAnim.toFixed(2) +
    " onGround=" + p.onGround + " state=" + game.state);
});

</script>

</body>
</html>
