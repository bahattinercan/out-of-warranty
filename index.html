<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="brand.title">Garanti Dışı (Out of Warranty)</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="stage">
      <header id="hud">
        <div class="center">
          <!-- Bu iki metni savaş döngüsü her karede yazar (game.js > updateHud):
               i18n anahtarı DOM'da değil kodda tutulur, aksi halde çift kaynak olur. -->
          <div id="turn-banner" data-i18n="hud.turnIdle">Sıra: -</div>
          <div id="wind-indicator" role="status" aria-live="polite" data-i18n="hud.windIdle">Rüzgar: -</div>
          <!-- Simge ile metin ayrı düğümlerde: çeviri yalnız metni değiştirir,
               glif (⛶ / ⏏) kaybolmaz. Öğenin kendi Türkçe metni fallback'tir. -->
          <button id="fullscreen-btn" title="Tam ekran (F)" data-i18n-title="hud.fullscreen.title">⛶ <span data-i18n="hud.fullscreen">Tam Ekran</span></button>
          <button id="quit-btn" title="Menüye dön (Esc)" data-i18n-title="hud.quit.title">⏏ <span data-i18n="hud.quit">Çıkış</span></button>
        </div>
      </header>

      <!-- Ses denetimi HUD'un dışında, sahneye sabit: HUD menülerde gizlenirken
           (karakter/harita/atölye ekranları) da erişilebilir kalır. -->
      <div id="audio-control" role="group" aria-label="Ses ayarları" data-i18n-aria="hud.audio.group">
        <button id="mute-btn" type="button" title="Sesi kapat (M)" aria-label="Sesi kapat" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M11 5 6 9H3v6h3l5 4Z" />
            <path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" />
            <path class="sound-off" d="m16 9 6 6m0-6-6 6" />
          </svg>
          <span id="mute-label">Ses</span>
        </button>
        <input id="volume-slider" type="range" min="0" max="100" step="1" value="100" aria-label="Ses düzeyi" data-i18n-aria="hud.volume" />
        <output id="volume-value" for="volume-slider">100%</output>
      </div>

      <!-- Dil seçici: seçenekler js/i18n.js'teki LANG_ORDER'dan üretilir — yeni
           dil eklenince burada değişiklik gerekmez. Ses denetimi gibi HUD
           dışında durur; menülerde de erişilebilir kalır. -->
      <div id="locale-control">
        <span aria-hidden="true">🌐</span>
        <label for="locale-select" data-i18n="hud.language">Dil</label>
        <select id="locale-select" aria-label="Dil"></select>
      </div>

      <canvas id="game" width="960" height="540"></canvas>

      <div id="power-bar" class="hidden">
        <div id="power-fill"></div>
        <div id="power-marker" class="hidden" title="Son atış gücü" data-i18n-title="hud.powerMarker"></div>
      </div>

      <div id="overlay" class="hidden">
        <div class="overlay-card">
          <h1 id="overlay-title">Tahsis Tamamlandı</h1>
          <p id="overlay-sub"></p>
          <div id="overlay-reward" class="hidden" role="status"></div>
          <div class="overlay-actions">
            <button id="workshop-btn" data-i18n="hud.goWorkshop">Atölyeye Git</button>
            <button id="restart-btn" data-i18n="hud.playAgain">Tekrar Oyna</button>
            <button id="menu-btn" class="secondary" data-i18n="hud.mainMenu">Ana Menü</button>
          </div>
        </div>
      </div>

      <div id="storage-warning" class="hidden" role="status" aria-live="polite"></div>

      <!-- Savaş alt paneli (Wild Ones düzeni): solda robot kartları (can +
           sıra), sağda silah değiştirme + seçili silah / modül / ışınlanma /
           kanca yuvaları. Mesajlaşma ve sipariş (order snack) yuvaları
           bilinçli olarak yok. -->
      <footer id="battle-bar" class="hidden">
        <div id="players" role="list" aria-label="Robotlar" data-i18n-aria="hud.robots"></div>
        <div id="battle-actions">
          <button id="weapon-toggle" type="button" title="Silah listesini aç/kapat (1–9)" data-i18n-title="hud.weaponList.title">
            <span data-i18n="hud.weaponToggle.a">SİLAH</span><span data-i18n="hud.weaponToggle.b">DEĞİŞTİR</span>
          </button>
          <button class="act-slot" id="slot-weapon" type="button" data-slot="weapon" title="Seçili silah" data-i18n-title="hud.slot.weapon">
            <canvas class="slot-icon" width="44" height="44"></canvas>
            <span class="slot-count"></span><span class="slot-name"></span>
          </button>
          <button class="act-slot" id="slot-skill" type="button" data-slot="skill" title="Dahili modül (Q)" data-i18n-title="hud.slot.skill">
            <canvas class="slot-icon" width="44" height="44"></canvas>
            <span class="slot-count"></span><span class="slot-name"></span>
          </button>
          <button class="act-slot" id="slot-teleport" type="button" data-slot="teleport" title="Işınlanma Topu" data-i18n-title="hud.slot.teleport">
            <canvas class="slot-icon" width="44" height="44"></canvas>
            <span class="slot-count"></span><span class="slot-name"></span>
          </button>
          <button class="act-slot" id="slot-hook" type="button" data-slot="hook" title="Kanca" data-i18n-title="hud.slot.hook">
            <canvas class="slot-icon" width="44" height="44"></canvas>
            <span class="slot-count"></span><span class="slot-name"></span>
          </button>
        </div>
      </footer>

      <div id="weapon-panel" class="hidden">
        <div id="weapon-bar"></div>
        <div id="weapon-desc"></div>
      </div>

    </div>

  </div>

  <!-- Klasik scriptler: file:// üzerinden çift tıklayınca çalışır -->
  <script src="js/i18n.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/parts.js"></script>
  <script src="js/market.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/skill-fx.js"></script>
  <script src="js/robots.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/entity.js"></script>
  <script src="js/projectile.js"></script>
  <script src="js/ai.js"></script>
  <!-- Çevrimiçi katman (F3c): protokol → taşıma → durum → oturum → köprü →
       lobi ekranı. game.js bunlara YALNIZ çalışma zamanında dokunur (sınıf
       tanımları TDZ olduğu için sıra korunur). PeerJS CDN'i burada DEĞİL,
       çevrimiçi ekrana ilk girişte tembel yüklenir (js/online-lobby.js). -->
  <script src="js/net/protocol.js"></script>
  <script src="js/net/transport.js"></script>
  <script src="js/net/state.js"></script>
  <script src="js/net/session.js"></script>
  <script src="js/net/adapter.js"></script>
  <script src="js/online-lobby.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
